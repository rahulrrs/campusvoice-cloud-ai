services:
  api:
    image: ${API_IMAGE:-campusvoice-api:local}
    build:
      context: .
    container_name: campusvoice-api
    env_file:
      - .env
    volumes:
      - ./.env:/app/.env:ro
      - ./outputs:/app/outputs
      - ./data:/app/data
    restart: unless-stopped
    expose:
      - "8000"

  nginx:
    image: nginx:1.27-alpine
    container_name: campusvoice-nginx
    depends_on:
      - api
    ports:
      - "80:80"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped
